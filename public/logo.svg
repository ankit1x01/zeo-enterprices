<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <!-- Definitions for luxury gold linear gradients to add premium sheen -->
  <defs>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d078" />
      <stop offset="30%" stop-color="#eab308" />
      <stop offset="70%" stop-color="#b28400" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>
    <linearGradient id="tealSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#129c73" />
      <stop offset="100%" stop-color="#0d7c5b" />
    </linearGradient>
  </defs>

  <!-- 1. Outer Ring -->
  <circle cx="100" cy="110" r="72" fill="none" stroke="url(#goldSheen)" stroke-width="4.5" />

  <!-- 2. Inner Ring -->
  <circle cx="100" cy="110" r="58" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" />

  <!-- 3. Laurel Wreath Ornaments (Left Side) -->
  <g fill="url(#goldSheen)">
    <!-- Pair 1 -->
    <path d="M 44 140 C 34 135, 30 120, 36 112 C 40 122, 46 128, 48 132 Z" />
    <!-- Pair 2 -->
    <path d="M 33 118 C 24 111, 22 96, 30 89 C 32 99, 36 106, 40 110 Z" />
    <!-- Pair 3 -->
    <path d="M 30 92 C 22 83, 24 68, 33 62 C 34 72, 36 80, 39 84 Z" />
    <!-- Pair 4 -->
    <path d="M 36 68 C 30 58, 36 44, 46 41 C 45 51, 44 58, 43 62 Z" />
    <!-- Top Leaf -->
    <path d="M 52 48 C 48 38, 58 26, 66 26 C 63 36, 59 42, 56 46 Z" />
  </g>

  <!-- Laurel Wreath Ornaments (Right Side - Mirrored) -->
  <g fill="url(#goldSheen)" transform="translate(200, 0) scale(-1, 1)">
    <path d="M 44 140 C 34 135, 30 120, 36 112 C 40 122, 46 128, 48 132 Z" />
    <path d="M 33 118 C 24 111, 22 96, 30 89 C 32 99, 36 106, 40 110 Z" />
    <path d="M 30 92 C 22 83, 24 68, 33 62 C 34 72, 36 80, 39 84 Z" />
    <path d="M 36 68 C 30 58, 36 44, 46 41 C 45 51, 44 58, 43 62 Z" />
    <path d="M 52 48 C 48 38, 58 26, 66 26 C 63 36, 59 42, 56 46 Z" />
  </g>

  <!-- 4. Crown (Sitting on top of the rings) -->
  <g fill="url(#goldSheen)">
    <path d="M 82 45 
             L 118 45 
             L 116 38 
             L 112 28 
             L 106 36 
             L 100 22 
             L 94 36 
             L 88 28 
             L 84 38 Z" />
    <!-- Crown tip pearls -->
    <circle cx="82" cy="45" r="2.5" />
    <circle cx="88" cy="28" r="2" />
    <circle cx="100" cy="22" r="3" />
    <circle cx="112" cy="28" r="2" />
    <circle cx="118" cy="45" r="2.5" />
    <!-- Crown base trim -->
    <rect x="80" y="47" width="40" height="3" rx="1" />
  </g>

  <!-- 5. Bottom Ribbon (Crest base) -->
  <g>
    <!-- Left Ribbon Fold Behind -->
    <path d="M 45 170 L 25 182 L 32 195 L 50 182 Z" fill="#09543e" opacity="0.9" />
    <!-- Right Ribbon Fold Behind -->
    <path d="M 155 170 L 175 182 L 168 195 L 150 182 Z" fill="#09543e" opacity="0.9" />
    
    <!-- Central Banner -->
    <path d="M 40 172 Q 100 186 160 172 L 155 190 Q 100 204 45 190 Z" fill="url(#tealSheen)" />
    
    <!-- Gold Ribbon Trim -->
    <path d="M 40 172 Q 100 186 160 172" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" />
    <path d="M 45 190 Q 100 204 155 190" fill="none" stroke="url(#goldSheen)" stroke-width="1.5" />
  </g>

  <!-- 6. Letters inside logo -->
  <!-- "GSS" Monogram in center in a beautiful serif font -->
  <text x="100" y="121" 
        font-family="Georgia, 'Times New Roman', serif" 
        font-size="34" 
        font-weight="bold" 
        fill="url(#tealSheen)" 
        text-anchor="middle"
        letter-spacing="1">GSS</text>
</svg>
